[project]
name = "knowledge"
version = "0.0.0"
description = "Explanation query API with RAG augmentation for the solar pipeline"
requires-python = ">=3.13"
dependencies = [
    "shared-lib",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.28", "test-utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
shared-lib = { workspace = true }
test-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]

[project.scripts]
knowledge = "knowledge.main:main"
