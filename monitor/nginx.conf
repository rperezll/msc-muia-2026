server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/explanations {
        proxy_pass http://knowledge:8080/api/explanations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/rabbitmq/queues/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rmq_upstream rabbitmq;
        set $qpath "";
        if ($request_uri ~ ^/api/rabbitmq/queues/%2F/(.*)$) {
            set $qpath $1;
        }
        proxy_pass http://$rmq_upstream:15672/api/queues/%2F/$qpath;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/rabbitmq/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rmq_upstream rabbitmq;
        set $rmq_suffix "";
        if ($request_uri ~ ^/api/rabbitmq/(.*)$) {
            set $rmq_suffix $1;
        }
        proxy_pass http://$rmq_upstream:15672/api/$rmq_suffix;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
